<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - PartyVerse</title>

    {% load static %}

    <link rel="stylesheet"
          href="{% static 'game/css/register.css' %}">

</head>

<body>

<div class="register-page">

    <div class="register-card">

        <div class="logo">
            🎉 PartyVerse
        </div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join PartyVerse and start playing!
        </p>


        {% if error %}

        <div class="error-message">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="mobile_number">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile_number"
                    name="mobile_number"
                    placeholder="Enter your mobile number"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirm_password">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="register-button">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
